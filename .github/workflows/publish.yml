name: Publish container
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          grep -Fq "ghcr.io/xblxnn/bidhelm:$(cat VERSION)" scripts/bootstrap.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go test -race ./...
          go vet ./...
      - name: Build linux/amd64 image
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t bidhelm:local .
      - name: Smoke test
        run: LOADCHECK=0 ./scripts/docker-smoke.sh
      - name: Publish to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag bidhelm:local "$image:$version"
          docker push "$image:$version"
          docker image inspect "$image:$version" --format '{{range .RepoDigests}}{{println .}}{{end}}' >> "$GITHUB_STEP_SUMMARY"
          printf '\nImage: `%s:%s`\nPlatform: `linux/amd64`\n' "$image" "$version" >> "$GITHUB_STEP_SUMMARY"
